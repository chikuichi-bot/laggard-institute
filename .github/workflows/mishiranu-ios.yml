name: mishiranu-ios

on:
  push:
    paths:
      - "mishiranu-ios/**"
      - ".github/workflows/mishiranu-ios.yml"
  pull_request:
    paths:
      - "mishiranu-ios/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Build for iOS Simulator
        working-directory: mishiranu-ios
        run: |
          xcodebuild build \
            -project MishiranuEki.xcodeproj \
            -scheme MishiranuEki \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO
